name: Update leaderboard

on:
  schedule:
    # GitHub often starts scheduled jobs hours late, so run three times a day. Each run rescans
    # everything, so extra runs are harmless and the board stays fresh even when one is delayed.
    - cron: "17 8 * * *"    # ~12:17am Pacific (just after the day closes)
    - cron: "17 14 * * *"   # ~6:17am Pacific
    - cron: "17 20 * * *"   # ~12:17pm Pacific
  workflow_dispatch:        # "Run workflow" button for manual refreshes

permissions:
  contents: write   # commit the updated leaderboard.json (keeps the final board after Oct 31)
  pages: write
  id-token: write

concurrency:
  group: leaderboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://antoineontheway.github.io/october-challenge/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rescan Discord and rebuild the board
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python scripts/score.py   # exits non-zero (and writes nothing) on any failure

      - name: Commit updated board
        run: |
          git config user.name "leaderboard-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/leaderboard.json
          git diff --cached --quiet || git commit -m "Update leaderboard $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # GitHub Pages publishing fails now and then ("try again later"). Retry once after a pause
      # with a fresh upload, so a hiccup doesn't leave yesterday's board online.
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retrying publish
        if: steps.deploy.outcome == 'failure'
        run: sleep 90
      - if: steps.deploy.outcome == 'failure'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-retry
      - if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-retry
